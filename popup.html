<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #333;
    }
    
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    
    .start-btn {
      background-color: #4CAF50;
      color: white;
    }
    
    .start-btn:hover {
      background-color: #45a049;
    }
    
    .stop-btn {
      background-color: #f44336;
      color: white;
    }
    
    .stop-btn:hover {
      background-color: #da190b;
    }
    
    .test-btn {
      background-color: #2196F3;
      color: white;
    }
    
    .test-btn:hover {
      background-color: #1976D2;
    }
    
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }
    
    .status.active {
      background-color: #e8f5e8;
      color: #2e7d32;
      border: 1px solid #4caf50;
    }
    
    .status.inactive {
      background-color: #f5f5f5;
      color: #666;
      border: 1px solid #ddd;
    }
    
    .status.test-complete {
      background-color: #e3f2fd;
      color: #1976d2;
      border: 1px solid #2196f3;
    }
    
    .status.error {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #f44336;
    }
    
    .stats {
      margin-top: 12px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>MDS Style Inspector</h1>
  </div>
  
  <div class="controls">
    <button id="startBtn" class="start-btn">Start Inspection</button>
    <button id="stopBtn" class="stop-btn" style="display: none;">Stop Inspection</button>
    <button id="testBtn" class="test-btn">Test Highlight</button>
  </div>
  
  <div id="status" class="status inactive">
    Inspection is inactive
  </div>
  
  <div id="stats" class="stats">
    <div>Hardcoded values found: <span id="hardcodedCount">0</span></div>
    <div>Elements inspected: <span id="inspectedCount">0</span></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
