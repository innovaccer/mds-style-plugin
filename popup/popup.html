<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #333;
    }
    
    .auto-inspection {
      margin-bottom: 16px;
      padding: 12px;
      background-color: #f8f9fa;
      border-radius: 6px;
      border: 1px solid #e9ecef;
    }
    
    .auto-inspection h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #333;
    }
    
    .auto-inspection p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: #666;
      line-height: 1.4;
    }
    
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      background-color: #ccc;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    .toggle-switch.active {
      background-color: #4CAF50;
    }
    
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background-color: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    
    .toggle-switch.active::after {
      transform: translateX(20px);
    }
    
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    
    .start-btn {
      background-color: #4CAF50;
      color: white;
    }
    
    .start-btn:hover {
      background-color: #45a049;
    }
    
    .stop-btn {
      background-color: #f44336;
      color: white;
    }
    
    .stop-btn:hover {
      background-color: #da190b;
    }
    
    .test-btn {
      background-color: #2196F3;
      color: white;
    }
    
    .test-btn:hover {
      background-color: #1976D2;
    }
    
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }
    
    .status.active {
      background-color: #e8f5e8;
      color: #2e7d32;
      border: 1px solid #4caf50;
    }
    
    .status.inactive {
      background-color: #f5f5f5;
      color: #666;
      border: 1px solid #ddd;
    }
    
    .status.test-complete {
      background-color: #e3f2fd;
      color: #1976d2;
      border: 1px solid #2196f3;
    }
    
    .status.error {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #f44336;
    }
    
    .stats {
      margin-top: 12px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Style Inspector</h1>
  </div>
  
  <div class="auto-inspection">
    <h3>Auto-Inspection</h3>
    <p>Automatically inspects pages for hardcoded CSS values. Enabled by default for immediate use.</p>
    <div class="toggle-container">
      <span id="autoStatus">Auto-inspection is enabled</span>
      <div id="autoToggle" class="toggle-switch active"></div>
    </div>
  </div>
  
  <div class="controls">
    <button id="startBtn" class="start-btn">Start Inspection</button>
    <button id="stopBtn" class="stop-btn" style="display: none;">Stop Inspection</button>
    <!-- <button id="testBtn" class="test-btn">Test Highlight</button> -->
  </div>
  
  <div id="status" class="status inactive">
    Inspection is inactive
  </div>
  
  <div id="stats" class="stats">
    <div>Hardcoded values found: <span id="hardcodedCount">0</span></div>
    <div>Elements inspected: <span id="inspectedCount">0</span></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
