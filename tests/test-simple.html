<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Test - MDS Style Inspector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        
        .test-box {
            margin: 16px;
            padding: 8px;
            width: 200px;
            height: 100px;
            background-color: #ff0000;
            color: #333333;
            font-size: 14px;
            border-radius: 4px;
            border: 2px solid #000000;
        }
        
        .test-button {
            padding: 12px 24px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            margin: 10px;
        }
        
        .test-text {
            color: #666666;
            font-size: 18px;
            line-height: 1.5;
            margin: 15px;
        }
    </style>
</head>
<body>
    <h1>Simple Test Page</h1>
    
    <div class="test-box">
        This box has hardcoded values: margin: 16px, padding: 8px, width: 200px, height: 100px, background-color: #ff0000
    </div>
    
    <button class="test-button">
        Button with hardcoded padding: 12px 24px
    </button>
    
    <div class="test-text">
        This text has hardcoded color: #666666 and font-size: 18px
    </div>
    
    <div style="margin: 20px; padding: 10px; background-color: #e0e0e0; border-radius: 8px;">
        Inline styles with hardcoded values
    </div>
    
    <script>
        // Add some dynamic elements with hardcoded styles
        setTimeout(() => {
            const newDiv = document.createElement('div');
            newDiv.style.cssText = 'margin: 25px; padding: 15px; background-color: #ffff00; color: #000000; font-size: 16px;';
            newDiv.textContent = 'Dynamically added element with hardcoded styles';
            document.body.appendChild(newDiv);
        }, 2000);
    </script>
</body>
</html>
